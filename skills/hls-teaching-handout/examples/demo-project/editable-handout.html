    <section class="section">
      <h2 id="s1-1" data-bookmark-level="2">1.1　从作者清单到中心判断</h2>
      <p data-font-size="11.5" data-line-height="1.75">有效的文献综述不是逐篇介绍作者观点，而是围绕一个中心判断组织多篇文献，说明证据之间的一致、分歧、限制和适用边界。</p>
      <p>用户可以在预览阶段修改这段文字、调整基础排版，或在下一段前插入手动分页符。</p>
      <table class="academic-table"><thead><tr><th>组织方式</th><th>读者看到的关系</th></tr></thead><tbody>
        <tr><td>按作者罗列</td><td>只能看到文献摘要，难以看到共同问题。</td></tr>
        <tr><td>按主题综合</td><td>可以比较证据、方法、边界与争议。</td></tr>
      </tbody></table>
    </section>
